<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">

 <!--- <link href="https://fonts.googleapis.com/css?family=Ubuntu:300,300i,400,400i,500,500i,700,700i" rel="stylesheet">-->
  <link href="https://fonts.googleapis.com/css?family=Quicksand:400,700|Raleway:400,700,800,900i|Ubuntu:300,500,700,700i|Crimson+Text:400,700" rel="stylesheet">

  <link rel="shortcut icon" type="image/png" href="{{ "/github.png" | relative_url }}">

  {% if page.mathjax %}
  <!-- Only pages with `mathjax: true` in their front matter load MathJax. -->
  <script>
  window.MathJax = {
    tex: {inlineMath: [['$','$'], ['\\(','\\)']]}
  };
  </script>
  <script defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js"
    integrity="sha384-OrHfGTnIbkl0do3N76qW/uWr38o91N05sbSPuYBPLH+hG8X/dNSrjZf3AGjzrCwC"
    crossorigin="anonymous"></script>
  {% endif %}
  <script type="text/javascript" src="https://platform.linkedin.com/badges/js/profile.js" async defer></script>
</head>
